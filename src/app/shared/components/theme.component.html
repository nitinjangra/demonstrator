<button
  type="button"
  class="theme-toggle"
  [class.theme-toggle--dark]="isDarkMode()"
  (click)="toggleTheme()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="isDarkMode()"
  [attr.title]="label()"
  [matTooltip]="label()"
>
  <span class="theme-toggle__icon" aria-hidden="true"></span>
</button>
