<mat-toolbar role="banner" class="global-header">
  @if (canShowHamburgerMenu) {
    <button matButton [matMenuTriggerFor]="afterMenu" aria-label="Open navigation menu">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <mat-menu #afterMenu="matMenu" xPosition="after">
      <button mat-menu-item>Item 1</button>
      <button mat-menu-item>Item 2</button>
    </mat-menu>
  }
  <a class="global-header-brand" routerLink="/landing" [attr.aria-label]="brandName() + ' home'">
    <mat-icon class="global-header-home-icon" aria-hidden="true">home</mat-icon>
    {{ brandName() }}
  </a>
  <span class="example-spacer"></span>
  @if (dashboardEnabled()) {
    <a class="global-header-dashboard" routerLink="/dashboard" aria-label="Dashboard" title="Dashboard">
      <mat-icon aria-hidden="true">dashboard</mat-icon>
    </a>
  }
  <app-theme-toggle></app-theme-toggle>
  <button class="settings-icon" type="button" routerLink="/settings/overview" aria-label="Open settings">
    <mat-icon aria-hidden="true">settings</mat-icon>
  </button>
</mat-toolbar>
