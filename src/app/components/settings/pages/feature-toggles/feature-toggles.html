<section class="feature-toggles" aria-labelledby="feature-toggles-title">
  <h2 id="feature-toggles-title">Feature toggles</h2>
  <p>Choose which application features are enabled.</p>

  <fieldset>
    <legend>Actions table (one selection required)</legend>
    <mat-slide-toggle
      class="feature-toggle-row"
      [checked]="draftTableFeature() === 'ag-grid'"
      (change)="setTableFeature('ag-grid', $event.checked)"
    >
      AG Grid
    </mat-slide-toggle>
    <mat-slide-toggle
      class="feature-toggle-row"
      [checked]="draftTableFeature() === 'material-table'"
      (change)="setTableFeature('material-table', $event.checked)"
    >
      Material table
    </mat-slide-toggle>
  </fieldset>

  <fieldset>
    <legend>Dashboard</legend>
    <mat-slide-toggle
      class="feature-toggle-row"
      [checked]="draftDashboardEnabled()"
      (change)="setDashboardEnabled($event.checked)"
    >
      Enable dashboard
    </mat-slide-toggle>
    <mat-slide-toggle
      class="feature-toggle-row"
      [checked]="draftChartLibrary() === 'chartjs'"
      (change)="setChartLibrary('chartjs', $event.checked)"
    >
      Chart.js
    </mat-slide-toggle>
    <mat-slide-toggle
      class="feature-toggle-row"
      [checked]="draftChartLibrary() === 'highcharts'"
      (change)="setChartLibrary('highcharts', $event.checked)"
    >
      Highcharts
    </mat-slide-toggle>
  </fieldset>
</section>

<app-sticky-footer [fixed]="false">
  <button matButton="filled" type="button" [disabled]="!hasUnsavedChanges()" (click)="saveChanges()">
    Save changes
  </button>
</app-sticky-footer>
