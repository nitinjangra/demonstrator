<section class="theme-settings" aria-labelledby="theme-settings-title">
  <h2 id="theme-settings-title">Theme</h2>
  <p>Choose the appearance used throughout the application.</p>

  <mat-button-toggle-group
    class="theme-options"
    aria-label="Color theme"
    [value]="preference()"
    (change)="setTheme($event.value)"
  >
    <mat-button-toggle value="light">Light</mat-button-toggle>
    <mat-button-toggle value="dark">Dark</mat-button-toggle>
    <mat-button-toggle value="system">Follow system</mat-button-toggle>
  </mat-button-toggle-group>

  <p class="current-theme" aria-live="polite">
    Theme preference: {{ preference() === 'system' ? 'Follow system' : preference() }}
    (currently {{ theme() }})
  </p>
</section>
