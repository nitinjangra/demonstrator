<app-priority-summary
  [rowData]="sourceRowData()"
  [selectedPriority]="selectedPriority()"
  [routeAppliedPriority]="routeAppliedPriority()"
  (prioritySelected)="togglePriorityFilter($event)"
  (filterCleared)="clearPriorityFilter()"
/>

<div class="ag-grid-frame" [class.table-route-highlight]="routeAppliedPriority() !== null">
  @if (rowData().length > 0) {
    <ag-grid-angular
      class="actions-grid"
      aria-label="Actions"
      [domLayout]="'autoHeight'"
      [pagination]="rowData().length > 10"
      [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 20, 50]"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [theme]="gridTheme"
    />
  } @else {
    <div class="actions-empty-state" role="status">
      <mat-icon aria-hidden="true">checklist</mat-icon>
      <span>{{ sourceRowData().length === 0 ? 'You’re all caught up. No actions need your attention.' : 'No actions match this priority filter.' }}</span>
    </div>
  }
</div>
