<app-priority-summary
  [rowData]="sourceRowData()"
  [selectedPriority]="selectedPriority()"
  (prioritySelected)="togglePriorityFilter($event)"
  (filterCleared)="clearPriorityFilter()"
/>

<div class="ag-grid-frame">
  <ag-grid-angular
    class="actions-grid"
    aria-label="Actions"
    [domLayout]="'autoHeight'"
    [rowData]="rowData()"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [theme]="gridTheme"
  />
</div>
