<app-priority-summary
  [rowData]="sourceRowData()"
  [selectedPriority]="selectedPriority()"
  [routeAppliedPriority]="routeAppliedPriority()"
  (prioritySelected)="togglePriorityFilter($event)"
  (filterCleared)="clearPriorityFilter()"
/>

<div
  class="ag-grid-frame"
  [class.table-route-highlight]="routeAppliedPriority() !== null"
  [class.ag-grid-frame--empty]="rowData().length === 0"
>
  @if (rowData().length > 0) {
    <ag-grid-angular
      class="actions-grid"
      [attr.aria-label]="'Actions, ' + rowData().length + ' items'"
      [pagination]="rowData().length > 10"
      [paginationPageSize]="pageSize()"
      [paginationPageSizeSelector]="[10, 20, 50]"
      (paginationChanged)="onPaginationChanged($event)"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [theme]="gridTheme"
    />
  } @else {
    <div class="actions-empty-state" role="status">
      <mat-icon aria-hidden="true">checklist</mat-icon>
      @if (sourceRowData().length === 0) {
        <p class="actions-empty-state-title">You’re all caught up</p>
        <p class="actions-empty-state-description">No actions need your attention.</p>
      } @else {
        <p class="actions-empty-state-description">No actions match this priority filter.</p>
      }
    </div>
  }
</div>
