<main class="landing">
  <header class="landing-greeting">
    <h1 class="landing-greeting-heading">
      {{ timeGreeting }}
      <span class="landing-greeting-heading-icon" aria-hidden="true">{{ greetingIcon }}</span>
    </h1>
    <p class="landing-greeting-description">Here’s what needs your attention today.</p>
  </header>
  <div class="landing-focus">
    <section class="landing-focus-content" aria-labelledby="actions-heading">
      <h2 id="actions-heading">Actions</h2>
      <app-actions-table-wrapper></app-actions-table-wrapper>
    </section>
    <app-announcements class="landing-focus-announcements"></app-announcements>
  </div>
</main>
